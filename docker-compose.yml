version: '3.8'
services:
  backend:
    build: ./backend
    container_name: afna-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - FRONTEND_URL=http://192.168.3.249:3000,http://localhost:3000
      - ENCRYPTION_KEY=afna-monitoring-center-secret-key-32b-change-me
      - JWT_SECRET=afna-jwt-super-secret-change-me-32b
      - JWT_EXPIRES=7d
      - POLL_INTERVAL=5000
      - HEALTH_POLL_INTERVAL=15000
      - NODE_ENV=production
    volumes:
      - backend_data:/app/data
    networks:
      - afna-net

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.3.249:3001
        - NEXT_PUBLIC_WS_URL=http://192.168.3.249:3001
    container_name: afna-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.3.249:3001
      - NEXT_PUBLIC_WS_URL=http://192.168.3.249:3001
    networks:
      - afna-net

volumes:
  backend_data:

networks:
  afna-net:
    driver: bridge
